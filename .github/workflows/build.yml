name: Build

# Bei jedem Push, auch auf Arbeits-Branches – so lässt sich die .exe vor dem Release ausprobieren
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests und portable .exe
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Abhängigkeiten
        run: python -m pip install -r requirements-build.txt
      - name: Tests
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee test.log
      # Die Protokolle sind nur angemeldet lesbar, Annotationen dagegen öffentlich
      - name: Fehlerausgabe als Annotation
        if: failure()
        shell: bash
        run: |
          msg=$(grep -vE '\.\.\. (ok|skipped.*)$' test.log | tail -80 | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Tests::$msg"
      - name: Bauen
        run: python tools/build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SystemRepairTool
          path: dist/release/
          if-no-files-found: error
